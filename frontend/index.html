<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO base — sobreescrito por react-helmet-async en cada página pública -->
    <title>Conejo Motors — Vehículos Eléctricos en Costa Rica</title>
    <meta name="description" content="Conejo Motors: concesionario de vehículos eléctricos en Costa Rica. BYD, MG, GWM y más marcas. Catálogo, precios y test drive disponibles." />
    <meta name="robots" content="index, follow" />

    <!-- Tarea 1: Canonical al dominio comercial (no al subdominio Firebase) -->
    <link rel="canonical" href="https://conejomotors.com/" />

    <!-- Tarea 5: OG url e imagen apuntando al dominio comercial -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Conejo Motors" />
    <meta property="og:title"       content="Conejo Motors — Vehículos Eléctricos en Costa Rica" />
    <meta property="og:description" content="Concesionario especializado en vehículos eléctricos. Mejores precios, financiamiento y garantía en Costa Rica." />
    <meta property="og:url"         content="https://conejomotors.com/" />
    <meta property="og:image"       content="https://conejomotors.com/og-default.png" />
    <meta property="og:locale"      content="es_CR" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Conejo Motors — Vehículos Eléctricos en Costa Rica" />
    <meta name="twitter:description" content="Concesionario especializado en vehículos eléctricos. Mejores precios, financiamiento y garantía en Costa Rica." />
    <meta name="twitter:image"       content="https://conejomotors.com/og-default.png" />

    <!-- Geo + Idioma -->
    <meta name="geo.region"    content="CR" />
    <meta name="geo.placename" content="Costa Rica" />
    <meta name="language"      content="es" />

    <!-- Tarea 4: JSON-LD AutoDealer estático — Google lo lee aunque el resto sea SPA -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoDealer",
      "name": "Conejo Motors",
      "url": "https://conejomotors.com",
      "logo": "https://conejomotors.com/favicon.png",
      "description": "Concesionario especializado en vehículos eléctricos en Costa Rica. BYD, MG, GWM y más marcas.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "CR",
        "addressRegion": "San José",
        "addressLocality": "Costa Rica"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
          "opens": "08:00",
          "closes": "18:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday"],
          "opens": "08:00",
          "closes": "13:00"
        }
      ],
      "sameAs": [
        "https://www.facebook.com/profile.php?id=61590859552347"
      ],
      "priceRange": "₡₡₡",
      "currenciesAccepted": "CRC",
      "paymentAccepted": "Cash, Credit Card, Bank Transfer"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
