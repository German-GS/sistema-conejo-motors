<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO base — sobreescrito por react-helmet-async en cada página -->
    <title>Conejo Motors — Vehículos Eléctricos en Costa Rica</title>
    <meta name="description" content="Conejo Motors: concesionario de vehículos eléctricos en Costa Rica. BYD, MG, GWM y más marcas. Catálogo, precios y test drive disponibles." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://conejo-motors.web.app/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Conejo Motors" />
    <meta property="og:title"       content="Conejo Motors — Vehículos Eléctricos en Costa Rica" />
    <meta property="og:description" content="Concesionario especializado en vehículos eléctricos. Mejores precios, financiamiento y garantía en Costa Rica." />
    <meta property="og:url"         content="https://conejo-motors.web.app/" />
    <meta property="og:image"       content="https://conejo-motors.web.app/og-default.jpg" />
    <meta property="og:locale"      content="es_CR" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Conejo Motors — Vehículos Eléctricos en Costa Rica" />
    <meta name="twitter:description" content="Concesionario especializado en vehículos eléctricos. Mejores precios, financiamiento y garantía en Costa Rica." />
    <meta name="twitter:image"       content="https://conejo-motors.web.app/og-default.jpg" />

    <!-- Geo + Idioma -->
    <meta name="geo.region"    content="CR" />
    <meta name="geo.placename" content="Costa Rica" />
    <meta name="language"      content="es" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
